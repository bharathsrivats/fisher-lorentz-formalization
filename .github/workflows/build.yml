name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build (the build runs the axiom gate)
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          test "$(grep -c 'axiom gate passed' build.log)" -ge 2 || { echo "AXIOM GATE DID NOT RUN FOR BOTH LIBRARIES"; exit 1; }
      - name: Audit gate - no sorry in any proof
        run: |
          if grep -nE '\bsorry\b|sorryAx|^axiom |native_decide' $(ls FisherLorentz/*.lean Confinement/*.lean | grep -v AxiomGate) \
             | grep -v -- '--' | grep -vi 'NOT proven'; then
            echo "AUDIT FAILED: sorry or axiom found in a proof"; exit 1
          fi
          echo "AUDIT PASSED: no sorry in any proof"
